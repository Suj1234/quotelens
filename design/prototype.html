<title>QuoteLens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F6F5F1;--surface:#FFFFFF;--ink:#1C1E22;--ink2:#3F434A;--muted:#6E727A;--faint:#9EA2A9;
  --hair:#DEDCD5;--hair2:#ECEAE4;--tint:#F1F0EB;--tint2:#E9E8E2;
  --accent:#0F6663;--accent-ink:#0B4E4B;--accent-tint:#E2EEEC;
  --amber:#955A0A;--amber-bg:#FAF0DB;--green:#2B7A4B;--green-bg:#E5F1E9;--indigo:#4757A6;--indigo-bg:#E7EAF6;--red:#A93A2E;--red-bg:#F7E6E3;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --rail:56px;--sheet:400px;--drawer:480px;--shadow:0 12px 32px rgba(20,22,26,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#16181B;--surface:#1D2024;--ink:#EAE9E4;--ink2:#C8C7C1;--muted:#9A9DA5;--faint:#6F727A;--hair:#31343A;--hair2:#282A2F;--tint:#24272C;--tint2:#2C2F35;
  --accent:#57B3AE;--accent-ink:#86CFCA;--accent-tint:#1F3231;--amber:#E2A650;--amber-bg:#3A2E18;--green:#72C08C;--green-bg:#1D3326;--indigo:#9DA8EA;--indigo-bg:#272C47;--red:#E48D81;--red-bg:#3F2420;--shadow:0 12px 32px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#16181B;--surface:#1D2024;--ink:#EAE9E4;--ink2:#C8C7C1;--muted:#9A9DA5;--faint:#6F727A;--hair:#31343A;--hair2:#282A2F;--tint:#24272C;--tint2:#2C2F35;
  --accent:#57B3AE;--accent-ink:#86CFCA;--accent-tint:#1F3231;--amber:#E2A650;--amber-bg:#3A2E18;--green:#72C08C;--green-bg:#1D3326;--indigo:#9DA8EA;--indigo-bg:#272C47;--red:#E48D81;--red-bg:#3F2420;--shadow:0 12px 32px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:22px;line-height:1.2}h2{font-size:15px}h3{font-size:13px}
p{margin:0}a{color:var(--accent-ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--hair);border-radius:5px;padding:7px 9px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}.num{text-align:right}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}.xs{font-size:11px}
.eyebrow{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--hair);border-radius:5px;background:var(--surface);color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink2)}.btn.quiet:hover{background:var(--tint)}
.btn.sm{height:25px;padding:0 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:3px;font-size:11px;font-weight:500;border:1px solid var(--hair);color:var(--ink2);background:var(--surface);white-space:nowrap}
.chip.amber{color:var(--amber);background:var(--amber-bg);border-color:transparent}.chip.green{color:var(--green);background:var(--green-bg);border-color:transparent}.chip.indigo{color:var(--indigo);background:var(--indigo-bg);border-color:transparent}.chip.red{color:var(--red);background:var(--red-bg);border-color:transparent}.chip.teal{color:var(--accent-ink);background:var(--accent-tint);border-color:transparent}.chip.grey{color:var(--muted);background:var(--tint);border-color:transparent}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--hair);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--faint)}

/* frame */
#app{display:flex;flex-direction:column;height:100%}
.topbar{height:48px;display:flex;align-items:center;gap:16px;padding:0 16px 0 14px;border-bottom:1px solid var(--hair);background:var(--surface);flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px}
.brand .mark{width:18px;height:18px;border:2px solid var(--ink);border-radius:3px;position:relative}.brand .mark::after{content:"";position:absolute;left:3px;top:3px;width:7px;height:7px;background:var(--accent)}
.topbar .spacer{flex:1}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}.iconbtn:hover{background:var(--tint);color:var(--ink)}
.user{display:flex;align-items:center;gap:8px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--tint2);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--ink2)}
.body{display:flex;flex:1;min-height:0}
.rail{width:var(--rail);flex:none;border-right:1px solid var(--hair);background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail a{width:40px;height:40px;display:grid;place-items:center;border-radius:6px;color:var(--muted);text-decoration:none;position:relative}
.rail a:hover{background:var(--tint);color:var(--ink)}.rail a.active{background:var(--accent-tint);color:var(--accent-ink)}
.rail a svg{width:18px;height:18px}
.rail .grow{flex:1}
.rail a .tip{position:absolute;left:48px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--paper);font-size:11px;padding:3px 7px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s}
.rail a:hover .tip{opacity:1}
.main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
.page{padding:22px 28px 48px;max-width:1180px;width:100%}
.page.wide{max-width:none;padding-bottom:0}
.rfxhead{padding:18px 28px 0;border-bottom:1px solid var(--hair);background:var(--surface)}
.rfxhead .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rfxhead .code{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.rfxhead .code button{border:1px solid var(--hair);border-radius:4px;padding:1px 7px;font-family:var(--mono);font-size:11.5px;color:var(--ink2);background:var(--surface)}
.rfxhead h1{margin-top:4px}
.rfxhead .meta{display:flex;gap:12px;align-items:center;color:var(--muted);margin-top:6px;flex-wrap:wrap;font-size:12.5px}
.rfxtabs{display:flex;gap:4px;margin-top:14px}
.rfxtabs a{padding:8px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;display:flex;gap:6px;align-items:center}
.rfxtabs a .cnt{font-family:var(--mono);font-size:11px;background:var(--tint);padding:0 5px;border-radius:3px;color:var(--ink2)}
.rfxtabs a.active{color:var(--ink);border-color:var(--ink)}
.status{display:inline-flex;align-items:center;gap:6px}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.issued::before,.status.receiving::before{background:var(--indigo)}.status.reviewing::before{background:var(--amber)}.status.awarded::before{background:var(--green)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:6px}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hair2)}
.card .bd{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.rail{display:none}:root{--sheet:100%}.page,.rfxhead{padding-left:16px;padding-right:16px}}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:12.5px}.kv dt{color:var(--muted)}.kv dd{margin:0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--hair);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--hair2);vertical-align:top}
table.t tbody tr:hover td{background:var(--tint)}
table.t td.num,table.t th.num{text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 13px;border-radius:5px;font-size:12.5px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--hair);border-radius:6px}
.lead{font-size:15px;line-height:1.5;max-width:64ch;color:var(--ink2)}
.lead b{color:var(--ink);font-weight:600}
.note{padding:10px 12px;border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:5px;background:var(--surface);font-size:12.5px}
.note.warn{border-left-color:var(--amber)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}

/* sign in */
.signin{min-height:100%;display:grid;grid-template-columns:1.15fr minmax(360px,460px)}
@media (max-width:900px){.signin{grid-template-columns:1fr}.signin .visual{display:none}}
.signin .visual{background:var(--surface);border-right:1px solid var(--hair);padding:44px 56px;display:flex}
.vis{display:flex;flex-direction:column;max-width:640px;width:100%;min-height:100%}
.vis h1{font-size:30px;margin-top:44px;max-width:20ch}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;margin-top:34px}
.step{display:grid;grid-template-columns:30px 1fr;gap:4px 12px;font-size:13px}
.step .ico{grid-row:1/3;width:30px;height:30px;border-radius:6px;background:var(--accent-tint);color:var(--accent-ink);display:grid;place-items:center}
.step .ico svg{width:16px;height:16px}
.step b{font-weight:600}.step span{color:var(--muted)}
.vis-mini{margin-top:34px;border:1px solid var(--hair);border-radius:6px;overflow:hidden;font-size:12.5px;background:var(--paper)}
.vm-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;border-bottom:1px solid var(--hair2)}
.vm-row>span{padding:9px 12px;text-align:right}.vm-row>span:first-child{text-align:left}
.vm-head{background:var(--tint);font-size:11px;color:var(--muted);letter-spacing:.03em}
.vm-row .min{box-shadow:inset 3px 0 0 var(--accent)}
.vm-row .amb{color:var(--amber);background:var(--amber-bg);font-family:var(--sans);font-size:11px}
.vm-row .nq{color:var(--faint);font-family:var(--sans);font-size:11px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hair2) 6px 7px)}
.vm-cap{padding:8px 12px;font-size:11.5px;color:var(--muted)}
.signin .form{padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;background:var(--paper)}
.signin .fwrap{max-width:340px;margin-top:44px}
.signin label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.signin input{width:100%}
.demo{margin-top:26px;border-top:1px solid var(--hair);padding-top:14px}
.demo .eyebrow{margin-bottom:8px}
.demo button{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:5px;text-align:left}
.demo button:hover{background:var(--tint)}
/* overview */
.vstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:1100px){.vstrip{grid-template-columns:repeat(2,1fr)}}
.vc{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.vc .nm{font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.vc .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:104px 16px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair2);font-size:12.5px}
.tl .ev .ts{font-family:var(--mono);font-size:11px;color:var(--muted)}.tl .ev .dir{font-family:var(--mono);color:var(--faint)}

/* copilot */
.split{display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.chat{display:flex;flex-direction:column;min-height:520px;max-height:calc(100vh - 220px)}
.chat .log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.msg{font-size:13px}.msg .from{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:3px;font-weight:500}
.msg.me{border-left:2px solid var(--ink);padding-left:12px}.msg.cp{border-left:2px solid var(--accent);padding-left:12px}
.msg .patch{margin-top:8px;border:1px solid var(--hair);border-radius:5px;padding:7px 10px;background:var(--tint);font-size:12px}
.chat .composer{border-top:1px solid var(--hair);padding:12px;display:flex;flex-direction:column;gap:8px}
.chat textarea{width:100%;min-height:64px;resize:vertical}
.sugg{display:flex;gap:6px;flex-wrap:wrap}.sugg button{border:1px solid var(--hair);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--ink2);background:var(--surface)}.sugg button:hover{border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--hair)}
.tabs button{padding:9px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}.tabs button.active{color:var(--ink);border-color:var(--ink)}

/* responses */
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stage{border:1px solid var(--hair);border-radius:5px;padding:9px 11px;background:var(--surface);position:relative;overflow:hidden}
.stage .nm{font-weight:500;display:flex;justify-content:space-between;align-items:center;text-transform:capitalize}
.stage .st{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}
.stage.done{border-color:var(--green)}.stage.done .st{color:var(--green)}
.stage.run{border-color:var(--accent)}.stage.run::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:var(--accent);animation:slide 1s linear infinite}
@keyframes slide{from{left:-40%}to{left:100%}}
@media (max-width:900px){.pipe{grid-template-columns:repeat(2,1fr)}}
.vrow{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--hair2)}
.vrow:last-child{border-bottom:0}
.vrow .nm{font-weight:600}.vrow .sub{font-size:12px;color:var(--muted)}
@media (max-width:900px){.vrow{grid-template-columns:1fr 1fr}}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(var(--sheet),100vw);background:var(--surface);border-left:1px solid var(--hair);z-index:30;transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet.open{transform:none}
.sheet .hd{padding:14px 16px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center}
.sheet .bd{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.drop{border:1px dashed var(--hair);border-radius:6px;padding:22px;text-align:center;color:var(--muted);background:var(--tint);cursor:pointer}.drop:hover{border-color:var(--accent)}
.filerow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--hair2);border-radius:5px;font-size:12.5px}
.filerow .ext{font-family:var(--mono);font-size:10px;padding:2px 5px;border:1px solid var(--hair);border-radius:3px;color:var(--muted)}
.pbar{height:4px;background:var(--tint2);border-radius:2px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle}.pbar i{display:block;height:100%;background:var(--indigo)}

/* review */
.rq{display:flex;flex-direction:column;gap:12px}
.rqcard{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:18px;padding:14px;border:1px solid var(--hair);border-radius:6px;background:var(--surface)}
@media (max-width:900px){.rqcard{grid-template-columns:1fr}}
.rqcard.resolved{opacity:.5}
.rqcard .ttl{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rqcard .prop{margin-top:10px;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}.rqcard .prop .v{font-family:var(--mono);font-size:18px}
.rqcard .acts{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
.evidence{border:1px solid var(--hair);border-radius:5px;overflow:hidden;background:var(--tint)}
.evidence img{display:block;width:100%}
.evidence .cap{padding:6px 10px;font-size:11px;color:var(--muted);border-top:1px solid var(--hair)}
.snip{padding:10px 12px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:var(--surface);line-height:1.5}
.snip mark{background:var(--amber-bg);color:var(--amber);padding:0 2px}
.email{border:1px solid var(--hair);border-radius:5px;background:var(--surface);font-size:12.5px;width:100%}
.email .h{padding:8px 12px;border-bottom:1px solid var(--hair2);display:grid;grid-template-columns:64px 1fr;gap:3px 8px;color:var(--muted)}.email .h b{color:var(--ink);font-weight:500}
.email .b{padding:12px;white-space:pre-wrap}

/* compare */
.cmpwrap{display:flex;flex-direction:column;flex:1;min-height:0;padding:14px 28px 0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:5px;overflow:hidden}.seg button{padding:5px 11px;font-size:12px;color:var(--muted);background:var(--surface)}.seg button.on{background:var(--ink);color:var(--paper)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-left:auto}.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border:1px solid var(--hair);border-radius:2px;display:inline-block}
.gridbox{flex:1;min-height:320px;overflow:auto;border:1px solid var(--hair);border-radius:6px;background:var(--surface)}
table.cmp{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:960px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--hair2);border-right:1px solid var(--hair2);padding:0}
table.cmp thead th{position:sticky;top:0;background:var(--surface);z-index:3;text-align:left;font-weight:500;vertical-align:top}
table.cmp th.line,table.cmp td.line{position:sticky;left:0;background:var(--surface);z-index:2;min-width:330px;max-width:330px}
table.cmp thead th.line{z-index:4}
table.cmp td.line{padding:6px 12px}
table.cmp td.line .d{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.cmp td.line .s{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh{padding:9px 12px;min-width:156px}.vh .nm{font-weight:600;display:flex;justify-content:space-between;gap:6px;align-items:center}
.vh .m{font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}.vh .tot{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:5px}
.cell{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 12px;height:36px;font-family:var(--mono);font-variant-numeric:tabular-nums;cursor:pointer;position:relative}
.cell:hover{background:var(--tint)}
.cell.min{box-shadow:inset 3px 0 0 var(--accent)}
.cell .flag{font-family:var(--sans);font-size:10px;color:var(--muted)}
.cell.inferred::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--indigo);position:absolute;left:7px;top:50%;transform:translateY(-50%)}
.cell.reviewed{color:var(--green)}
.cell.low{color:var(--amber);border:1px dotted var(--amber);margin:2px}
.cell.ambiguous{background:var(--amber-bg);color:var(--amber)}
.cell.notq{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hair2) 6px 7px);color:var(--faint);font-family:var(--sans);font-size:11px}
.cell.prior{background:repeating-linear-gradient(0deg,transparent 0 5px,var(--hair2) 5px 6px);color:var(--muted);font-family:var(--sans);font-size:11px}
.cell.excluded{text-decoration:line-through;color:var(--faint)}.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cell[data-tip]:hover::after{content:attr(data-tip);position:absolute;right:8px;top:100%;z-index:5;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none}

/* ask / decide */
.qa{border:1px solid var(--hair);border-radius:6px;background:var(--surface);padding:14px 16px}
.qa .q{font-weight:600;font-size:14px;margin-bottom:8px}
.qa .a{font-size:13.5px;line-height:1.55;max-width:70ch}
.qa .how{margin-top:8px;font-size:12px;color:var(--muted)}.qa .how button{color:var(--accent-ink);font-weight:500}
.qa pre{margin:8px 0 0;padding:10px;background:var(--tint);border-radius:5px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:var(--ink2)}
.qa .excl{margin-top:8px;font-size:12px;color:var(--amber)}
.qa .rows{margin-top:10px;border:1px solid var(--hair2);border-radius:5px;overflow:auto;max-height:260px}.qa .rows table{font-size:11.5px}
.qa .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.askbox{border:1px solid var(--hair);border-radius:6px;background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.askbox textarea{width:100%;min-height:56px;resize:none;border:0;padding:4px 2px;font-size:14px;background:transparent}
.askbox textarea:focus{outline:none}
.askbox .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qgroups{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:900px){.qgroups{grid-template-columns:1fr}}
.qgroup .eyebrow{margin-bottom:6px}
.qgroup button{display:block;width:100%;text-align:left;padding:7px 10px;border:1px solid var(--hair);border-radius:5px;background:var(--surface);font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.qgroup button:hover{border-color:var(--ink);color:var(--ink)}
.bar{display:flex;align-items:center;gap:8px;font-size:11.5px;margin:4px 0}.bar .lbl{width:120px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .trk{flex:1;height:10px;background:var(--tint2);border-radius:2px;overflow:hidden}.bar .fill{height:100%;background:var(--accent)}.bar .v{font-family:var(--mono);width:80px;text-align:right}
.brief{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
@media (max-width:900px){.brief{grid-template-columns:1fr}}
.delta{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1.1}
.delta small{font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:400}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,22,26,.22);z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--drawer),100vw);background:var(--surface);border-left:1px solid var(--hair);z-index:30;transform:translateX(102%);transition:transform .18s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.open{transform:none}
.drawer .hd{padding:14px 18px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer .big{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.1}
.drawer .bd{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.drawer h3{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;font-weight:500}
.chain{display:flex;flex-direction:column}.chain .step{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--hair2);font-size:12.5px;align-items:start}.chain .step .n{font-family:var(--mono);color:var(--faint)}.chain .step .basis{font-size:10.5px;color:var(--muted);white-space:nowrap}
.alt{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0}.alt .p{font-family:var(--mono);color:var(--muted)}

/* memo */
.memo{background:var(--surface);border:1px solid var(--hair);padding:36px 40px;max-width:800px;font-size:13px;line-height:1.55}
.memo h1{font-size:19px;margin-bottom:2px}.memo h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:500}
.memo .sig{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:30px}.memo .sig div{border-top:1px solid var(--ink);padding-top:6px}
.lock{padding:9px 12px;background:var(--tint);border:1px solid var(--hair);border-radius:5px;font-size:12.5px;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}.stat .v{font-family:var(--mono);font-size:24px;font-weight:500}.stat .l{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.stage.run::after{animation:none}.drawer,.sheet{transition:none}}
</style>

// ---------- cell model ----------
function cell(n,v){
  const l=LN[n]; const r=S.review[key(n,v)];
  let c={n,v,state:"not_quoted",val:null,orig:null,chain:[],best:null,prob:null};
  if(v==="balaji"){ c.val=DATA.balaji[n]; c.state="confirmed"; c.orig={val:c.val,unit:"per 1000 nos",cur:"INR"}; c.prob=0.94;
    c.chain=[{s:"Read cell H"+(10+n)+" on sheet 'Price Offer'",b:"vendor stated"},{s:"Unit 'per 1000 Nos' = RFx unit, no conversion",b:"vendor stated"}];
    c.src={type:"cell",ref:"Price Offer!H"+(10+n),text:`[row ${10+n}] B=${n}  C=SBP-${1000+n}  D=${l.d.replace(/ \d-ply/,"").split(" ").slice(0,2).join(" ")}  E=${l.d.match(/\d+x\d+(x\d+)?/)[0]}  F=${l.ply} ply / BF  H=${inr(c.val)}  I=18%`}; }
  else if(v==="kohinoor"){ if(DATA.kohinoor[n]==null){ c.state="not_quoted"; c.src={type:"pdf",text:"Items 28–30 (partition sets) are not in our manufacturing range and are not quoted.",page:1}; }
    else { const p=DATA.kohinoor[n]; c.orig={val:p,unit:"per 1000 pcs (net of 2.5%)",cur:"INR"}; c.val=Math.round(p/0.975*100)/100; c.state="inferred"; c.prob=0.91;
      c.chain=[{s:`Read table row ${n}, page 1: ${inr(p)}`,b:"vendor stated"},{s:"Footnote *: rates are net of 2.5% early-payment discount (payment within 10 days). RFx payment terms are 45 days → payable = printed ÷ 0.975",b:"assumption · discount_treatment"}];
      c.src={type:"pdfimg",page:1,text:`Sr ${n} | ${l.d} | ${l.ply}/BF | ${inr(p)}`}; } }
  else if(v==="westline"){ const w=DATA.westline[n]; c.orig={val:w.pb,unit:"per bundle",cur:"INR"};
    const stated = w.st; const bs = S.clarified && TRUE_BUNDLE[n]? TRUE_BUNDLE[n] : w.bs;
    if(stated){ c.val=w.pb*1000/w.bs; c.state="confirmed"; c.prob=0.9; c.chain=[{s:`Read "item ${n} … Rs ${inr(w.pb)}/- per bundle of ${w.bs} nos"`,b:"vendor stated"},{s:`per bundle → per 1000 pcs: × 1000 ÷ ${w.bs}`,b:"vendor stated pack size"}];
      c.src={type:"text",text:`… item ${n} (${l.d.split("-ply ")[1]}) Rs ${inr(w.pb)}/- per bundle of ${w.bs} nos; …`,hl:`per bundle of ${w.bs} nos`}; }
    else if(S.clarified){ c.val=w.pb*1000/bs; c.state="reviewed"; c.prob=0.9; c.chain=[{s:`Read "… item ${n} … Rs ${inr(w.pb)}/- per bundle" — pack size not stated`,b:"vendor stated"},{s:`Vendor clarification (email, 24 Sep): "${bs} per bundle"`,b:"vendor stated · clarification"},{s:`× 1000 ÷ ${bs}`,b:"vendor stated"}];
      c.src={type:"text",text:`Item ${n} (${l.d.match(/\d+x\d+x?\d*/)[0]}, ${l.ply}-ply): ${bs} per bundle`,hl:`${bs} per bundle`}; }
    else { c.state="ambiguous"; c.best=w.pb*1000/w.bs; c.prob=0.6; c.chain=[{s:`Read "… item ${n} … Rs ${inr(w.pb)}/- per bundle" — pack size NOT stated for this item`,b:"vendor stated"},{s:`Best guess ${w.bs}/bundle from the vendor's other ${l.ply}-ply items — not applied`,b:"system inferred"}];
      c.src={type:"text",text:`… For items ${n===5||n===9?"5 and 9":"15 & 19"} our price is Rs ${inr(DATA.westline[n===9?5:n===19?15:n].pb)}/- and Rs ${inr(DATA.westline[n===5?9:n===15?19:n].pb)}/- per bundle respectively.`,hl:"per bundle respectively"}; } }
  else if(v==="orientpack"){ const u=DATA.orient[n]; c.orig={val:u,unit:"per 1000 pcs",cur:"USD"};
    if(n===14){ c.state="low"; c.best=u*FX; c.prob=0.38; c.chain=[{s:"Read row 14 from photo — price partly hidden, read as '?0.?2'",b:"vision · raw confidence 0.38"},{s:`If 90.32: × ${FX} (USD→INR, ${FXDATE}) = ${inr(u*FX)}`,b:"assumption · fx_rate"}]; c.src={type:"photo"}; }
    else { c.val=u*FX; c.state="inferred"; c.prob=0.88; c.chain=[{s:`Read row ${n} from photo: USD ${u.toFixed(2)}`,b:"vision · raw confidence 0.86"},{s:`× ${FX} USD→INR (${FXDATE})`,b:"assumption · fx_rate"},{s:"FOB Chennai — freight not included; landed view adds buyer estimate ₹180/1000",b:"assumption · freight_treatment"}]; c.src={type:"photo"}; } }
  else if(v==="anand"){ const r2=DATA.anand[n];
    if(r2==null){ c.state="prior"; c.src={type:"text",text:"sheets, layer pad and partition (item 23 to 30) rest same as last year only, no change from our side.",hl:"rest same as last year"}; c.chain=[{s:"Email: 'rest same as last year' — prior pricing not on file",b:"vendor stated"}]; }
    else { c.val=r2*l.w; c.state="inferred"; c.orig={val:r2,unit:"per kg",cur:"INR"}; c.prob=0.9;
      c.chain=[{s:`Email: "${l.ply} ply boxes (item ${l.ply===5?"1 to 12":"13 to 22"}) - Rs.${r2}/- per kg"`,b:"vendor stated"},{s:`per kg → per 1000 pcs: ₹${r2} × ${l.w} g/pc = ₹${inr(r2*l.w)}`,b:"assumption · weight from RFx spec"},{s:"freight extra at actuals — landed view adds ₹180/1000",b:"assumption · freight_treatment"}];
      c.src={type:"text",text:`${l.ply} ply boxes (item ${l.ply===5?"1 to 12":"13 to 22"}) - Rs.${r2}/- per kg`,hl:`Rs.${r2}/- per kg`}; } }
  // review overrides
  if(r){ if(r.action==="confirm"){c.state="reviewed"; c.val=c.best??c.val;} if(r.action==="override"){c.state="reviewed"; c.val=r.value; c.chain.push({s:`Buyer override: ${inr(r.value)} — "${r.note}"`,b:"buyer entered"});} if(r.action==="exclude"){c.state="excluded"; c.val=null; c.chain.push({s:`Excluded: "${r.note}"`,b:"buyer entered"});} if(r.action==="notq"){c.state="not_quoted"; c.val=null;} }
  const vend=VN[v]; c.landed = c.val==null? null : c.val + (vend.freight?0:FREIGHT);
  return c;
}
function allCells(){const m={};for(const l of L)for(const v of V)m[key(l.n,v.c)]=cell(l.n,v.c);return m;}

  items.push({id:"k-val",type:"validity_short",vendor:"kohinoor",n:null,title:"Validity 30 days (RFx asked 60)",prob:null,prop:null,note:"Quote expires 29 Oct 2026, before a likely award date.",src:{type:"pdfimg",text:"3. Validity: 30 days from date of quotation."}});

function ask(q){
  const cells=allCells(); const ql=q.toLowerCase();
  const qual = /qualif|clear|questionnaire/.test(ql); const landed = /landed|delivered|all-in|freight/.test(ql);
  const basisCol = landed?"landed_price":"unit_price";
  const sqlBase = (extra)=>`select line_no, description, vendor, ${basisCol} as price,\n       round(${basisCol} * annual_qty / 1000) as annual_value_inr\nfrom v_comparison\nwhere rfx_id = '${S.rfx}'\n  and state in ('confirmed','inferred','reviewed')\n  and ${basisCol} is not null${extra}`;
  const elig = (c)=> c.val!=null && ["confirmed","inferred","reviewed"].includes(c.state) && (!qual || VN[c.v].cleared===true);
  const unsure = L.flatMap(l=>V.map(v=>cells[key(l.n,v.c)])).filter(c=>["ambiguous","low","prior"].includes(c.state));
  const exclV = qual? V.filter(v=>v.cleared!==true).map(v=>`${v.n} (${v.dq})`) : [];
  let res={q, text:"", sql:"", how:"", excl:"", rows:null, chart:null, scen:null};
  function cheapest(filter){ const out=[]; let tot=0; for(const l of L){ if(filter&&!filter(l)) continue; const cs=V.map(v=>cells[key(l.n,v.c)]).filter(elig); if(!cs.length){out.push({n:l.n,d:l.d,vendor:"—",p:null,av:null,note:"no eligible quote"});continue;} cs.sort((a,b)=>(landed?a.landed:a.val)-(landed?b.landed:b.val)); const w=cs[0],ru=cs[1]; const p=landed?w.landed:w.val; const av=p*l.aq/1000; tot+=av; out.push({n:l.n,d:l.d,vendor:VN[w.v].n,p,av,ru:ru?VN[ru.v].n:"—",gap:ru?(((landed?ru.landed:ru.val)/p-1)*100):null}); } return {out,tot}; }
  if(/export/.test(ql)){ res.text="Exported the last answer as an Excel file (prototype: download is simulated)."; res.how="exports/query-"+(S.ask.length+1)+".xlsx"; toast("Excel exported"); }
  else if(/cheapest|lowest|per line|award/.test(ql) && !/save|versus|vs|single|everything/.test(ql)){
    const {out,tot}=cheapest(); const vs=[...new Set(out.map(r=>r.vendor))].filter(x=>x!=="—");
    res.text=`Cheapest ${qual?"qualified ":""}vendor per line on ${landed?"landed":"unit"} price totals ₹${cr(tot)} a year across ${out.filter(r=>r.p).length} lines, split among ${vs.length} vendors (${vs.map(v=>v+" "+out.filter(r=>r.vendor===v).length).join(", ")}).`;
    res.sql=`with eligible as (\n  ${sqlBase(qual?"\n  and vendor_id in (select vendor_id from v_vendor_status where rfx_id = '"+S.rfx+"' and cleared_questionnaire = true)":"").replace(/\n/g,"\n  ")}\n),\nranked as (\n  select *, row_number() over (partition by line_no order by price) as rk from eligible\n)\nselect line_no, description, vendor, price, annual_value_inr from ranked where rk = 1 order by line_no`;
    res.how=`Eligible cells: state confirmed/inferred/reviewed${qual?", vendor cleared all disqualifying questions":""}. ${unsure.length} unsure cells excluded (ambiguous, low-confidence, prior-pricing).`;
    res.excl = (exclV.length? "Excluded vendors: "+exclV.join("; ")+". " : "") + (unsure.length? unsure.length+" unsure cells excluded." : "");
    res.rows={cols:["Line","Description","Vendor","₹/1000","Annual ₹","Runner-up","Gap"],data:out.map(r=>[r.n,r.d,r.vendor,r.p?inr(r.p):"—",r.av?inr(r.av):"—",r.ru||"—",r.gap!=null?r.gap.toFixed(1)+"%":"—"])};
    res.scen={name:`Cheapest ${qual?"qualified ":""}per line (${landed?"landed":"unit"})`,rule:res.how,tot,alloc:out};
  }
  else if(/sav|versus|vs\b|single vendor|everything to|all to/.test(ql)){
    const {tot}=cheapest(); const m=ql.match(/to (\w+)/); const named=m?V.find(v=>v.c.startsWith(m[1])||v.n.toLowerCase().includes(m[1])):null;
    const totals=V.filter(v=>v.cleared===true||S.inclDq).map(v=>{const t=vendorTotal(v.c,cells,landed?"landed":"unit");return {v,...t};});
    const full=totals.filter(t=>t.cnt===30); const base= named? totals.find(t=>t.v.c===named.c) : (full.length?full:totals).sort((a,b)=>a.t-b.t)[0];
    const note = base.cnt<30? ` ${base.v.n} priced only ${base.cnt} of 30 lines, so the comparison is on those ${base.cnt} lines plus the cheapest available for the rest.`:"";
    const baseT = base.cnt<30 ? base.t + cheapest(l=>cells[key(l.n,base.v.c)].val==null).tot : base.t;
    res.text=`Per-line award saves ₹${cr(baseT-tot)} a year (${((1-tot/baseT)*100).toFixed(1)}%) against giving everything to ${base.v.n} at ₹${cr(baseT)}.${note}`;
    res.sql=`select vendor, sum(${basisCol} * annual_qty / 1000) as total_inr, count(*) as lines_priced\nfrom v_comparison where rfx_id = '${S.rfx}' and state in ('confirmed','inferred','reviewed')\ngroup by vendor order by total_inr`;
    res.how="Baseline = one vendor's total on the lines it priced; gaps filled with the cheapest eligible quote. Per-line total from the previous rule.";
    res.chart={title:"Annual total by strategy (₹)",bars:[["Per-line award",tot],...totals.sort((a,b)=>a.t-b.t).map(t=>[t.v.n+(t.cnt<30?" ("+t.cnt+"/30)":""),t.t])]};
  }
  else if(/only one|single (qualified )?quote|one quote|sole/.test(ql)){
    const rows=[]; for(const l of L){const cs=V.map(v=>cells[key(l.n,v.c)]).filter(c=>elig(c)||(qual===false&&false)); const cq=cs.filter(c=>VN[c.v].cleared===true); if(cq.length<=1) rows.push([l.n,l.d,cq.length?VN[cq[0].v].n:"none",cq.length?inr(cq[0].val):"—",inr((cq[0]?cq[0].val:0)*l.aq/1000)]);}
    res.text=`${rows.length} lines have one or zero qualified quotes — mostly partition sets (Kohinoor doesn't make them, Westline is disqualified, Anand referenced prior pricing). Worth a second round before award.`;

    const q1=cheapest(); const tot=a.tot+b.tot;
    res.text=`Split rule totals ₹${cr(tot)} — 5-ply lines to the cheapest qualified vendor (₹${cr(a.tot)}), 3-ply to the cheapest overall (₹${cr(b.tot)}). That is ₹${cr(Math.abs(tot-q1.tot))} ${tot<q1.tot?"less":"more"} than cheapest-qualified everywhere, but the 3-ply half includes vendors who did not clear the questionnaire.`;
    res.sql=`-- group 1: ply = 5, qualified only\n-- group 2: ply = 3, all vendors\n… (two ranked CTEs unioned; see scenario rule)`; res.how="Grouped rule; each group ranked separately."; res.scen={name:"Split by ply",rule:"5-ply → cheapest qualified; 3-ply → cheapest overall",tot,alloc:[...a.out,...b.out]};

    res.how="Value at stake = best guess × annual quantity."; res.rows={cols:["Line","Description","Vendor","Why","Best guess","₹ at stake"],data:rows};
  }

    res.sql=`select kind, description, basis from v_assumptions where rfx_id = '${S.rfx}' and vendor = 'OrientPack Ltd' and kind = 'fx_rate';\nselect sum(original_value * ${FX} * 1.03 * annual_qty / 1000) as total_if_plus_3pct from v_comparison where vendor_code = 'orientpack' and original_currency = 'USD'`;
    res.how="Re-ran the column at rate × 0.97 and × 1.03."; res.chart={title:"OrientPack annual total vs FX (₹)",bars:[["@ 80.66",t*0.97],["@ 83.15",t],["@ 85.64",t*1.03]]};
  }

    res.text="Anand quoted per kilogram (₹42/kg for 5-ply, ₹38/kg for 3-ply), not per 1000 pieces. The system converted using the weight per piece from our own RFx spec — for line 1 that is ₹42 × 1,318 g = ₹55,360 per 1000, about 20% under the next vendor. That number depends on our weight assumption, so every Anand cell is marked inferred, and Anand has not cleared Q6 (BRC in process), so they are excluded from qualified-only answers.";
    res.sql=`select line_no, original_value, original_unit, unit_price, conversion_chain from line_quotes q join rfx_lines l on l.id = q.rfx_line_id\nwhere vendor_id = (select id from vendors where short_code = 'anand') and rfx_id = '${S.rfx}' limit 5`; res.how="Read from the conversion chain and the questionnaire state; no new computation.";
  }
  else if(/validity|valid/.test(ql)){ res.text="Kohinoor's quote expires soonest — 29 Oct 2026 (30 days, versus 60 requested). The others run to late November. A 30-day validity is flagged on Kohinoor's column."; res.sql=`select vendor, validity_until from v_vendor_status where rfx_id = '${S.rfx}' order by validity_until`; res.how="Read from vendor terms."; res.rows={cols:["Vendor","Valid to"],data:V.map(v=>[v.n,v.validity])}; }
  else if(/line (\d+)|item (\d+)/.test(ql)){ const n=+(ql.match(/(?:line|item) (\d+)/)[1]); const cs=V.map(v=>cells[key(n,v.c)]); res.text=`Line ${n} (${LN[n].d}): `+cs.map(c=>`${VN[c.v].n} — ${c.val!=null?"₹"+inr(c.val):({not_quoted:"not quoted",prior:"references prior pricing",ambiguous:"ambiguous",low:"low-confidence"}[c.state]||c.state)}`).join("; ")+"."; res.sql=`select vendor, state, unit_price from v_comparison where rfx_id = '${S.rfx}' and line_no = ${n}`; res.how="One line, all vendors."; }
  else { res.text="I answer by running a query over the normalised comparison. Try one of the suggestions below, or ask about a line, a vendor, validity, freight, FX or the unsure cells."; res.how=""; }
  S.ask.push(res); return res;

function baseline(cells){ let best=null; for(const v of V){ if(v.cleared!==true) continue; let t=0; for(const l of L){ const c=cells[key(l.n,v.c)]; let p=(c.val!=null&&["confirmed","inferred","reviewed"].includes(c.state))?c.val:null; if(p==null){ const alts=V.map(x=>cells[key(l.n,x.c)]).filter(x=>x.val!=null&&["confirmed","inferred","reviewed"].includes(x.state)&&VN[x.v].cleared===true).map(x=>x.val); p=alts.length?Math.min(...alts):0; } t+=p*l.aq/1000; } if(best==null||t<best.t) best={v,t}; } return best; }

  <div class="card"><table class="t"><thead><tr><th>Time</th><th>Purpose</th><th>Provider</th><th>Model</th><th class="num">In</th><th class="num">Out</th><th class="num">Latency</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono xs">${r[0]}</td><td class="mono xs">${r[1]}</td><td>${r[2]}</td><td class="mono xs">${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td></tr>`).join("")}</tbody></table></div></div>`; }
function Eval(){ return Settings(); } function Logs(){ return Settings(); }

function Drawer(k){ const [n,v]=k.split(":"); const c=cell(+n,v); const l=LN[+n]; const vend=VN[v]; const alts=[{l:`L${n} ${l.d}`,p:c.prob||0},{l:`L${(+n)%30+1} ${LN[(+n)%30+1].d}`,p:c.prob?Math.max(0.02,(1-c.prob)*0.6):0},{l:"none of these",p:c.prob?(1-c.prob)*0.4:1}];
  const st={confirmed:"Confirmed",inferred:"Inferred",reviewed:"Reviewed",low:"Low-confidence",ambiguous:"Ambiguous",not_quoted:"Not quoted",prior:"References prior pricing",excluded:"Excluded"}[c.state];
  return `<div class="hd"><div><div class="eyebrow">Line ${n} · ${vend.n}</div><div class="big">${c.val!=null?"₹"+inr(S.basis==="landed"?c.landed:c.val):c.best?"₹"+inr(c.best)+"?":"—"} <span class="small muted" style="font-family:var(--sans);font-weight:400">per 1000 pcs${S.basis==="landed"?" landed":""}</span></div><div class="small" style="margin-top:5px"><span class="chip ${c.state==="reviewed"?"green":["low","ambiguous"].includes(c.state)?"amber":c.state==="inferred"?"indigo":"grey"}">${st}</span> <span class="muted">${l.d}</span></div></div><button class="btn quiet sm" data-act="closedrawer">Close</button></div>
  <div class="bd"><div><h3>Source</h3>${Evidence(c.src,v,+n)}</div>${c.orig?`<div><h3>As written</h3><div class="small"><span class="mono">${c.orig.cur==="USD"?"$ "+c.orig.val.toFixed(2):"₹ "+inr(c.orig.val)}</span> <span class="muted">${c.orig.unit}</span></div></div>`:""}
  <div><h3>Mapping</h3><div class="small muted" style="margin-bottom:4px">Which RFx line does this item belong to? · ${c.prob?"LLM-estimated":"—"}</div>${c.prob?alts.map(a=>`<div class="alt"><span>${h(a.l)}</span><span class="p">p ${a.p.toFixed(2)}</span></div>`).join(""):`<div class="small muted">No item mapped for this vendor.</div>`}</div>
  <div><h3>Conversion chain</h3><div class="chain">${c.chain.length?c.chain.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><span>${h(s.s)}</span><span class="basis">${h(s.b)}</span></div>`).join(""):`<div class="small muted">Nothing to convert.</div>`}</div></div>
  <div><h3>Review</h3><div class="small">${S.review[k]?`<span class="chip green">${S.review[k].action}</span> by Sujit Menon · today`:["ambiguous","low"].includes(c.state)?(isVP()?'<span class="muted">Waiting for Sujit.</span>':`<a href="#rfx/${S.rfx}/review" class="btn sm">Open in queue</a>`):'<span class="muted">Nothing pending.</span>'}</div></div></div>`; }

function Sheet(kind){ if(kind==="ask"){ const sugg=["Cheapest vendor per line, only among vendors who cleared the questionnaire","What does that save versus giving everything to Kohinoor?","Which lines have only one qualified quote?","Which cells are you not sure about, and how much money rides on them?"];
    return `<div class="hd"><b>Ask</b><button class="btn quiet sm" data-act="closesheet">Close</button></div><div class="bd" id="asklog">${S.ask.length?S.ask.map((a,i)=>QA(a,i)).join(""):`<div class="small muted">Ask in plain language. Every number comes from a query over the grid.</div>`}</div><div style="border-top:1px solid var(--hair);padding:12px 16px;display:flex;flex-direction:column;gap:8px"><div class="sugg">${sugg.filter(s=>!S.ask.some(a=>a.q===s)).slice(0,3).map(s=>`<button data-ask="${h(s)}">${h(s)}</button>`).join("")}</div><textarea id="askin" style="width:100%;min-height:52px;resize:none" placeholder="Ask about prices, coverage, assumptions…"></textarea><div style="display:flex;justify-content:flex-end"><button class="btn primary sm" data-act="asksend">Ask</button></div></div>`; }
  const vc=kind.split(":")[1]; const v=VN[vc];
  return `<div class="hd"><b>Add response — ${v.n}</b><button class="btn quiet sm" data-act="closesheet">Close</button></div><div class="bd"><label class="drop"><input type="file" multiple hidden data-drop="${vc}"><div><b>Drop files or click</b></div><div class="xs muted" style="margin-top:4px">xlsx · pdf · docx · jpg · eml — any layout, any format</div></label><div class="eyebrow">or paste the email body</div><textarea style="min-height:120px;width:100%" placeholder="Dear Sujit sir, our rates as below…"></textarea><div style="display:flex;justify-content:space-between;gap:8px"><button class="btn sm" data-sample="${vc}">Use seed file</button><button class="btn primary" data-submit="${vc}">Submit and run</button></div><div class="hint">Runs classify → extract → map → normalise → questionnaire → flags. Same path as a Gmail reply.</div></div>`; }

// ---------- events ----------
function openDrawer(k){ S.sel=k; const d=document.getElementById("drawer"); d.innerHTML=Drawer(k); d.classList.add("open"); document.getElementById("scrim").classList.add("open"); bindOverlay(d); }
function openSheet(kind){ S.sheet=kind; const s=document.getElementById("sheet"); s.innerHTML=Sheet(kind); s.classList.add("open"); document.getElementById("scrim").classList.add("open"); bindOverlay(s); }
function closeOverlays(){ S.sel=null; S.sheet=null; document.getElementById("drawer").classList.remove("open"); document.getElementById("sheet").classList.remove("open"); document.getElementById("scrim").classList.remove("open"); }
document.getElementById("scrim").addEventListener("click",()=>{closeOverlays();render();});
function runPipeline(vc){ const stages=["classify","extract","map","normalise","questionnaire","flags"]; const dur={classify:1200,extract:2600,map:1300,normalise:500,questionnaire:1500,flags:600}; S.pipeline[vc]={}; S.openResp=vc; let i=0; const step=()=>{ if(i>0) S.pipeline[vc][stages[i-1]]="done"; if(i<stages.length){ S.pipeline[vc][stages[i]]="run"; render(); i++; setTimeout(step,dur[stages[i-1]]); } else { render(); toast(VN[vc].n+" processed — items in the grid"); } }; step(); }
function setTheme(t){ S.theme=t; if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); try{localStorage.setItem("ql-theme",t||"");}catch(e){} }
function bindOverlay(root){ root.querySelectorAll("[data-act='closedrawer'],[data-act='closesheet']").forEach(b=>b.onclick=()=>{closeOverlays();render();}); bindCommon(root); }
function bindCommon(root){
  root.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{ask(b.dataset.ask); if(S.sheet) openSheet("ask"); else render(); scrollAsk();});
  root.querySelectorAll("[data-sql]").forEach(b=>b.onclick=()=>{const p=document.getElementById("sql-"+b.dataset.sql);p.hidden=!p.hidden;b.textContent=p.hidden?"Show query":"Hide query";});
  root.querySelectorAll("[data-savescen]").forEach(b=>b.onclick=()=>{const a=S.ask[+b.dataset.savescen];if(!S.scenarios.some(s=>s.name===a.scen.name)){S.scenarios.push(a.scen);toast("Saved: "+a.scen.name);}else toast("Already saved"); if(S.sheet) openSheet("ask"); else render();});
  root.querySelectorAll("[data-act='asksend']").forEach(b=>b.onclick=()=>{ const t=root.querySelector("#askin")?.value.trim(); if(!t) return; ask(t); if(S.sheet) openSheet("ask"); else render(); scrollAsk(); });
  root.querySelectorAll("#askin").forEach(ta=>ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); root.querySelector("[data-act='asksend']").click();} });
  root.querySelectorAll("[data-act='export']").forEach(b=>b.onclick=()=>toast("Export ready (prototype: download simulated)"));
  root.querySelectorAll("[data-act='bestguess']").forEach(b=>b.onclick=()=>toast("Re-run with best guesses — both totals shown side by side in the build"));
  root.querySelectorAll("[data-sample]").forEach(b=>b.onclick=()=>toast("Seed file attached: "+VN[b.dataset.sample].fmt));
  root.querySelectorAll("[data-submit]").forEach(b=>b.onclick=()=>{const v=b.dataset.submit; closeOverlays(); go(`rfx/${S.rfx}/responses`); setTimeout(()=>runPipeline(v),150);});
  root.querySelectorAll("[data-drop]").forEach(i=>i.onchange=()=>toast(i.files.length+" file(s) attached — Submit and run"));
}
function bind(){
  document.querySelectorAll("[data-login]").forEach(b=>b.onclick=()=>{S.user=b.dataset.login;go("rfx");});
  document.querySelectorAll("[data-act='signin']").forEach(b=>b.onclick=()=>{const e=(document.getElementById("em")?.value||"").toLowerCase(); S.user=/priya/.test(e)?"priya":"sujit"; go("rfx");});
  document.querySelectorAll("[data-open]").forEach(r=>r.onclick=()=>{const c=r.dataset.open; if(c==="MER-0418"&&!S.issued&&!isVP()) go("new"); else go("rfx/"+c);});
  document.querySelectorAll("[data-cell]").forEach(c=>c.onclick=()=>{openDrawer(c.dataset.cell); render();});
  document.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{S.ctab=b.dataset.ctab;render();});
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{const v=b.dataset.view; if(v==="orig"){S.showOrig=true;} else {S.showOrig=false;S.basis=v;} render();});
  const o=document.getElementById("orig"); if(o) o.onchange=()=>{S.showOrig=o.checked;render();};
  const inc=document.getElementById("incl"); if(inc) inc.onchange=()=>{S.inclDq=inc.checked;render();};
  bindCommon(document);
  document.querySelectorAll("[data-rq]").forEach(b=>b.onclick=()=>{ const id=b.dataset.id, act=b.dataset.rq; const it=queueItems().find(i=>i.id===id);
    if(act==="confirm"){ S.review[key(it.n,it.vendor)]={action:"confirm"}; S.ack[id]="confirmed"; toast("Confirmed — cell now counts"); }
    else if(act==="override"){ const card=document.getElementById("rq-"+id); card.querySelector(".acts").innerHTML=`<input id="ovv" placeholder="₹ per 1000" style="width:130px" class="mono"> <input id="ovn" placeholder="reason (goes in the ledger)" style="width:240px"> <button class="btn sm primary" id="ovok">Save</button>`; document.getElementById("ovok").onclick=()=>{const val=+document.getElementById("ovv").value; if(!val){toast("Enter a value");return;} S.review[key(it.n,it.vendor)]={action:"override",value:val,note:document.getElementById("ovn").value||"buyer override"}; S.ack[id]="overridden"; render();}; return; }
    else if(act==="exclude"){ S.review[key(it.n,it.vendor)]={action:"exclude",note:"excluded in review"}; S.ack[id]="excluded"; toast("Excluded from comparison"); }
    else if(act==="ask"){ const card=document.getElementById("rq-"+id); const lines= it.type==="prior_pricing"? "items 23–30" : it.type==="questionnaire_ambiguous"? "Q6 BRC status" : "items 5, 9, 15, 19 — pieces per bundle"; card.querySelector(".acts").innerHTML=`<div class="email"><div class="h"><span>To</span><b>${VN[it.vendor].n}</b><span>Reply-To</span><b class="mono xs">sujit+rfx-mer-0419-${it.vendor}-clar-1@gmail.com</b><span>Subject</span><b>Re: RFx ${S.rfx} — clarification on ${lines}</b></div><div class="b">Dear ${VN[it.vendor].n.split(" ")[0]} team,\n\nThank you for your quotation. To compare on the same basis we need one clarification: ${it.type==="prior_pricing"?"please state the current price in INR per 1000 pieces for items 23 to 30 (we do not hold last year's rates against this RFx).":it.type==="questionnaire_ambiguous"?"please confirm the expected date of your BRC certificate and whether a food-grade declaration is available in the meantime.":"please state the number of pieces per bundle for items 5, 9, 15 and 19, so we can convert your bundle prices to per 1000 pieces."}\n\nPlease reply to this email.\n\nRegards,\nSujit Menon · Meridian Foods</div></div><div style="display:flex;gap:6px;margin-top:8px"><button class="btn sm primary" id="sendclar">Send</button><button class="btn sm quiet" id="cancelclar">Cancel</button></div>`; document.getElementById("sendclar").onclick=()=>{ S.ack[id]="asked vendor"; if(it.vendor==="westline") S.clarSent=true; toast("Sent — logged under vendor communications"); render(); }; document.getElementById("cancelclar").onclick=render; return; }
    else if(act==="notq"){ for(const n of [23,24,25,26,27,28,29,30]) S.review[key(n,"anand")]={action:"notq"}; S.ack[id]="not quoted"; toast("Items 23–30 treated as not quoted"); }
    else if(act==="q-yes"){ VN.anand.cleared=true; VN.anand.dq=null; S.ack[id]="accepted as yes"; toast("Anand now cleared"); }
    else if(act==="q-no"){ VN.anand.cleared=false; VN.anand.dq="Q6 BRC: No (buyer decision)"; S.ack[id]="treated as no"; toast("Anand disqualified"); }
    else if(act==="ack"){ S.ack[id]="acknowledged"; }
    else if(act==="edit"){ go("settings"); return; }
    render(); });
  document.querySelectorAll("[data-act]").forEach(b=>{ const a=b.dataset.act; if(["asksend","export","bestguess","signin","closedrawer","closesheet"].includes(a)) return; b.onclick=()=>{
    if(a==="switch"){ S.user=S.user==="sujit"?"priya":"sujit"; toast("Now "+(S.user==="sujit"?"Sujit Menon":"Priya Raghavan")); if(S.route.startsWith("rfx/")) go("rfx/"+S.rfx); else go("rfx"); }
    if(a==="theme"){ const cur=document.documentElement.getAttribute("data-theme"); const dark = cur? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; setTheme(dark?"light":"dark"); render(); }
    if(a==="switchrfx"){ go("rfx"); }
    if(a==="ackall"){ for(const it of queueItems()) if(["fx_assumption","freight_treatment","discount_treatment","validity_short"].includes(it.type)) S.ack[it.id]="acknowledged"; render(); }
    if(a==="vendorreply"){ S.clarified=true; for(const n of [5,9,15,19]) S.ack["w"+n]="resolved by reply"; toast("Westline reply read — 4 cells resolved (bundles 25 / 20 / 50 / 40)"); render(); }
    if(a==="opensheet"){ openSheet(b.dataset.sheet); }
    if(a==="gotoresp"){ S.openResp=b.dataset.v; go(`rfx/${S.rfx}/responses`); }
    if(a==="openresp"){ S.openResp = S.openResp===b.dataset.v? null : b.dataset.v; render(); }
    if(a==="runall"){ runPipeline(b.dataset.v); }
    if(a==="sync"){ toast("Inbox synced — nothing new"); }
    if(a==="assign"){ toast("In the build: assign to a vendor or create 'Sunrise Packers'"); }
    if(a==="cpsend"){ const t=document.getElementById("cpin").value.trim(); if(t) cp(t); }
    if(a==="issue"){ S.issued=true; S.rfx="MER-0418"; toast("Issued — 5 emails sent (mock)"); go("rfx/MER-0418"); }
    if(a==="save"){ toast("Draft saved"); }
    if(a==="genmemo"){ const sel=document.getElementById("scsel"); S.award={i:sel?+sel.value:0}; toast("Memo generated — Priya can approve"); render(); }
    if(a==="approve"){ S.approved=true; toast("Approved — RFx locked"); render(); }
    if(a==="sendback"){ S.award=null; toast("Sent back to Sujit with your note"); render(); }
  };});
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>cp(b.dataset.cp));
  const cpi=document.getElementById("cpin"); if(cpi) cpi.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault(); cp(cpi.value.trim());} };
}
function scrollAsk(){ const l=document.getElementById("asklog"); if(l&&S.sheet) l.scrollTop=l.scrollHeight; }
function cp(t){ if(!t) return; S.cpLog.push({who:"me",t}); const tl=t.toLowerCase(); let rep;
  if(/line sheet|rfx_lines|attach/.test(tl)){ S.rfxDraft.lines=true; rep={who:"cp",t:"Parsed 30 lines from rfx_lines.xlsx — sizes, ply, GSM, monthly quantities and weight per piece. They're in the Lines tab for you to confirm; nothing was added that wasn't in the sheet.",patch:`<b>Lines</b> · 30 parsed · 12 × 5-ply boxes · 10 × 3-ply boxes · 5 sheets · 3 partition sets`}; }
  else if(/standard|per 1000|freight|45|60/.test(tl)){ S.rfxDraft.terms=true; rep={who:"cp",t:"Set. Terms are in the Terms tab — change anything inline.",patch:`<b>Terms</b> · INR · per 1000 pieces · delivered, freight included · 45-day payment · 60-day validity · 12 months · Hosur, Nelamangala`}; }
  else if(/questionnaire|bis|brc/.test(tl)){ S.rfxDraft.q=true; rep={who:"cp",t:"Drafted 10 questions for corrugated packaging. Q1 (BIS/ISO 9001), Q3 (capacity ≥ 200 t/month) and Q6 (BRC) are disqualifying.",patch:`<b>Questionnaire</b> · 10 questions · 3 disqualifying · attached as PDF on dispatch`}; }
  else if(/vendor/.test(tl)){ rep={who:"cp",t:"Added the five vendors from last year's event with their contacts.",patch:`<b>Vendors</b> · Sri Balaji Packaging · Kohinoor Corrugators · Westline Packaging · OrientPack Ltd · Anand Box Works`}; }
  else if(/line|sku|sheet|paste|upload/.test(tl)){ rep={who:"cp",t:"I don't invent line items. Attach last year's sheet or paste rows, and I'll parse them into the Lines tab for you to confirm."}; }
  else rep={who:"cp",t:"Noted. Anything else on scope, or shall I draft the questionnaire and terms?"};
  S.cpLog.push(rep); render(); const l=document.getElementById("cplog"); if(l) l.scrollTop=l.scrollHeight; }
document.addEventListener("click",e=>{const a=e.target.closest("a[href^='#']"); if(a){e.preventDefault(); go(a.getAttribute("href").slice(1));}});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&(S.sel||S.sheet)){closeOverlays();render();} if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault(); toast("Command palette: jump to a line, vendor or page (in the build)");} });
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1)||"rfx"; if(r===S.route) return; S.route=r; closeOverlays(); render();});
try{ const t=localStorage.getItem("ql-theme"); if(t) setTheme(t); else setTheme("light"); }catch(e){ setTheme("light"); }
S.route="signin"; render();
</script>
